name: Update profile stats

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=shdwgod&show_icons=true&hide_title=true&hide_border=true&bg_color=0D1117&text_color=9ca3af&icon_color=a78bfa&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=shdwgod&layout=compact&hide_border=true&bg_color=0D1117&text_color=9ca3af&title_color=a78bfa&langs_count=6&count_private=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
