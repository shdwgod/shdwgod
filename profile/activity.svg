<svg xmlns="http://www.w3.org/2000/svg" width="467" height="190" viewBox="0 0 467 190" role="img" aria-labelledby="title desc">
    <title id="title">GitHub activity in 2026</title>
    <desc id="desc">94 commits, 2 pull requests, 0 issues and 2 repositories contributed to.</desc>
    <rect width="466" height="189" x=".5" y=".5" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="28" y="35" class="heading">GitHub activity · 2026</text>
    <text x="439" y="35" class="period" text-anchor="end">YEAR TO DATE</text>
    
      <g transform="translate(28 78)">
        <circle cx="5" cy="-4" r="3" fill="#A78BFA"/>
        <text x="18" y="0" class="label">Commits</text>
        <text x="405" y="0" class="value" text-anchor="end">94</text>
      </g>
    
      <g transform="translate(28 103)">
        <circle cx="5" cy="-4" r="3" fill="#A78BFA"/>
        <text x="18" y="0" class="label">Pull requests</text>
        <text x="405" y="0" class="value" text-anchor="end">2</text>
      </g>
    
      <g transform="translate(28 128)">
        <circle cx="5" cy="-4" r="3" fill="#A78BFA"/>
        <text x="18" y="0" class="label">Issues</text>
        <text x="405" y="0" class="value" text-anchor="end">0</text>
      </g>
    
      <g transform="translate(28 153)">
        <circle cx="5" cy="-4" r="3" fill="#A78BFA"/>
        <text x="18" y="0" class="label">Repositories</text>
        <text x="405" y="0" class="value" text-anchor="end">2</text>
      </g>
    
    <style>
      .heading{font:600 17px 'Segoe UI',sans-serif;fill:#C4B5FD}
      .period{font:600 10px 'Segoe UI',sans-serif;fill:#8B949E;letter-spacing:1px}
      .label{font:500 13px 'Segoe UI',sans-serif;fill:#C9D1D9}
      .value{font:700 13px 'Segoe UI',sans-serif;fill:#FFFFFF}
